<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XML Generator</title>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    object-src 'none';
    connect-src 'self';
    img-src 'self' data: blob:;
    media-src blob:;
  ">

</head>

  <label for="userInput">Enter text:</label><br>

  <script src="script.js"></script>
</body>
</html>
